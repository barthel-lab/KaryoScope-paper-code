# KaryoScope-ROBs configuration TEMPLATE (placeholders only).
#
# The per-sample values (scaffold names, breakpoint centres, display bounds,
# SST1 array start/end) come from the dbGaP-approved ROB assemblies
# (phs003920) and are not distributed here. Fill every <...> field from your
# own KaryoScope annotation of those assemblies (robs/README.md, steps 2-4),
# save as conf/robs.yaml (or point ROBS_CONFIG at the file), then run the
# figure scripts (step 5).
#
# Structure as in KaryoScope-ROBs conf/robs.yaml at 1188850 (unchanged since
# df5acf9), with `pipeline:` cut to the Fig. 3 step, plus `inputs:` and the
# `sst1_arrays` section, which scripts/sst1_kmer_composition.py reads instead of
# the table it previously held in code.
#
# Coordinates are in the SCAFFOLDED frame unless a key says otherwise.
# Note: zoom_levels are half-widths (a 5,000,000 entry draws a 10 Mb window).
# Layout: one top-level section per use, so further analyses can add their own
# section (for example `a2_step3:`, `a6_rob:`, `a7_job3:`) without touching the
# figure sections. Shared per-sample values live in `samples` and
# `breakpoint_groups`; a new section should refer to those keys rather than
# repeat coordinates.
#   inputs                                    record of assembly/annotation paths
#   pipeline, scripts, colors_dir, database,  conductor settings (Fig. 3)
#     output_base_dir, bed_template, samples
#   breakpoint_groups                         per-sample breakpoints and display windows
#   defaults, *_analyses                      conductor analyses (Fig. 3 = the stacked one)
#   sst1_arrays                               SST1 array bounds (ED Fig. 7 d)
#   a2_step3, a6_rob, a7_job3                 revision analyses (revision/a2-k-sensitivity/step3,
#                                             revision/a6-parameter-sweeps/rob, revision/a7-review-checks/job3)
name: KaryoScope ROBs Analysis
# Inputs, for the record: where your copies of the assemblies (dbGaP phs003920)
# and of their KaryoScope annotations live. No script reads this section; the
# commands in robs/README.md take these paths. The figure scripts read the
# binned and per-base BEDs from data/robs/ (bed_dir below).
inputs:
  GM03417:
    hap1_fasta: <path to the haplotype 1 assembly FASTA>
    hap2_fasta: <path to the haplotype 2 assembly FASTA>
    annotation_dir: <directory with the KS_human_CHM13 annotations of both haplotypes>
  GM03786:
    hap1_fasta: <path to the haplotype 1 assembly FASTA>
    hap2_fasta: <path to the haplotype 2 assembly FASTA>
    annotation_dir: <directory with the KS_human_CHM13 annotations of both haplotypes>
  GM04890:
    hap1_fasta: <path to the haplotype 1 assembly FASTA>
    hap2_fasta: <path to the haplotype 2 assembly FASTA>
    annotation_dir: <directory with the KS_human_CHM13 annotations of both haplotypes>
pipeline:
- iscn.assembly_contig_zoom_plot_stacked
scripts:
  iscn: <path to vendored/KaryoScope-ISCN>
colors_dir: <directory with KS_human_CHM13.<featureset>.colors.txt>
database: KS_human_CHM13
output_base_dir: results
bed_template: '{bed_dir}/{assembly_name}.{database}.{featureset}.presmoothed.scaffolded.binned{bin}.features.bed.gz'
samples:
  GM03417:
    assembly_name: GM03417.assembly
    bed_dir: data/robs
    sex: XX
    role: sample
  GM03786:
    assembly_name: GM03786.assembly
    bed_dir: data/robs
    sex: XX
    role: sample
  GM04890:
    assembly_name: GM04890.assembly
    bed_dir: data/robs
    sex: XX
    role: sample
