# --- conductor defaults and analyses ---
defaults:
  merge_beds:
    featuresets_to_merge:
    - chromosome
    - region
    bin: 1000000
  assembly_contig_zoom_plot:
    background: white
    featuresets: chromosome,gene,repeat,region,acrocentric
  assembly_contig_zoom_plot_stacked:
    background: white
    featuresets: chromosome,gene,repeat,region,acrocentric
  assembly_figure:
    layout: grid
assembly_contig_zoom_plot_analyses:
- name: GM03417 breakpoints
  sample: GM03417
  breakpoint_group: gm03417_breakpoints_only
  output_dir: results/contig_zoom_plots/GM03417
- name: GM03786 breakpoints
  sample: GM03786
  breakpoint_group: gm03786_breakpoints_only
  output_dir: results/contig_zoom_plots/GM03786
- name: GM04890 breakpoints
  sample: GM04890
  breakpoint_group: gm04890_breakpoints_only
  output_dir: results/contig_zoom_plots/GM04890
assembly_contig_zoom_plot_stacked_analyses:
- name: Robertsonian integrated (3 samples)
  output: results/contig_zoom_plots/robertsonian_integrated.svg
  entries:
  - sample: GM03417
    breakpoint_group: gm03417_robertsonian
  - sample: GM03786
    breakpoint_group: gm03786_robertsonian
  - sample: GM04890
    breakpoint_group: gm04890_robertsonian
  stacked_args:
    no_refine: true
    panel_letters: true
    hide_scale_bars: true
    zoom_levels: 5000000,500000,100000
assembly_figure_analyses:
- name: GM03417 assembly figure
  sample: GM03417
  output: results/assembly_figure/GM03417_figure_grid.svg
  figure_args:
    layout: grid
    bed_dir: data/robs
    colors_dir: <colors_dir>
    centromeres: data/robs/GM03417.assembly.KS_human_CHM13.region.presmoothed.scaffolded.centromeres.bed.gz
    database: KS_human_CHM13
- name: GM03786 assembly figure
  sample: GM03786
  output: results/assembly_figure/GM03786_figure_grid.svg
  figure_args:
    layout: grid
    bed_dir: data/robs
    colors_dir: <colors_dir>
    centromeres: data/robs/GM03786.assembly.KS_human_CHM13.region.presmoothed.scaffolded.centromeres.bed.gz
    database: KS_human_CHM13
- name: GM04890 assembly figure
  sample: GM04890
  output: results/assembly_figure/GM04890_figure_grid.svg
  figure_args:
    layout: grid
    bed_dir: data/robs
    colors_dir: <colors_dir>
    centromeres: data/robs/GM04890.assembly.KS_human_CHM13.region.presmoothed.scaffolded.centromeres.bed.gz
    database: KS_human_CHM13
# --- SST1 arrays (ED Fig. 7 d) ---
sst1_arrays:
- sample: GM03417
  asm: GM03417.assembly
  scaffold: <scaffold name, scaffolded frame>
  iscn: rob(14;21)
  arrays:
  - - Upstream partial
    - <start, bp>
    - <end, bp>
  - - Main array
    - <start, bp>
    - <end, bp>
  - - Downstream partial
    - <start, bp>
    - <end, bp>
- sample: GM03786
  asm: GM03786.assembly
  scaffold: <scaffold name, scaffolded frame>
  iscn: rob(13;14)
  arrays:
  - - Upstream partial
    - <start, bp>
    - <end, bp>
  - - Main array
    - <start, bp>
    - <end, bp>
  - - Downstream partial
    - <start, bp>
    - <end, bp>
- sample: GM04890
  asm: GM04890.assembly
  scaffold: <scaffold name, scaffolded frame>
  iscn: rob(13;14)
  arrays:
  - - Upstream partial
    - <start, bp>
    - <end, bp>
  - - Main array
    - <start, bp>
    - <end, bp>
  - - Downstream partial
    - <start, bp>
    - <end, bp>
# --- A2 Step 3 (revision/a2-k-sensitivity/step3/): the ROB breakpoint as a function of k ---
# Per-sample values the Step 3 scripts pin. The fusion scaffold, the ISCN window
# (start, end) and the two partner chromosomes (chrom1 = upstream/left,
# chrom2 = downstream/right) are read from the breakpoint group named here.
# Scaffolded frame throughout.
a2_step3:
  samples:
    GM03417:
      breakpoint_group: gm03417_robertsonian
      detected_pos: <breakpoint position detected at k = 31 (karyoscope-iscn), bp>
      up_band: 21p11.2
      down_band: 14p11.2
      scaffold_length: <fusion scaffold length in the k = 31 scaffold map, bp>
      sst1_mid: <SST1 block midpoint from your acrocentric annotation (sst1_blocks.sh), bp>
      cytoband_pivot_breakpoint: <breakpoint reported by the k = 31 cytoband-pivot run (run_step1_verify.sh, iscn_regions.tsv), bp>
      corrected_window: [<last left-dominant window start, bp>, <first sustained right-dominant window end, bp>]
      published_ci_width_mb: <99% interval width of the submitted manuscript, Mb>
      published_delta_kb: <distance to the SST1 midpoint read from the submitted figure, kb>
    GM03786:
      breakpoint_group: gm03786_robertsonian
      detected_pos: <breakpoint position detected at k = 31 (karyoscope-iscn), bp>
      up_band: 14p11.2
      down_band: 13p11.2
      scaffold_length: <fusion scaffold length in the k = 31 scaffold map, bp>
      sst1_mid: <SST1 block midpoint from your acrocentric annotation (sst1_blocks.sh), bp>
      cytoband_pivot_breakpoint: <breakpoint reported by the k = 31 cytoband-pivot run (run_step1_verify.sh, iscn_regions.tsv), bp>
      corrected_window: [<last left-dominant window start, bp>, <first sustained right-dominant window end, bp>]
      published_ci_width_mb: <99% interval width of the submitted manuscript, Mb>
      published_delta_kb: <distance to the SST1 midpoint read from the submitted figure, kb>
    GM04890:
      breakpoint_group: gm04890_robertsonian
      detected_pos: <breakpoint position detected at k = 31 (karyoscope-iscn), bp>
      up_band: 14p11.2
      down_band: 13p11.2
      scaffold_length: <fusion scaffold length in the k = 31 scaffold map, bp>
      sst1_mid: <SST1 block midpoint from your acrocentric annotation (sst1_blocks.sh), bp>
      cytoband_pivot_breakpoint: <breakpoint reported by the k = 31 cytoband-pivot run (run_step1_verify.sh, iscn_regions.tsv), bp>
      corrected_window: [<last left-dominant window start, bp>, <first sustained right-dominant window end, bp>]
      published_ci_width_mb: <99% interval width of the submitted manuscript, Mb>
      published_delta_kb: <distance to the SST1 midpoint read from the submitted figure, kb>
# --- A6 ROB sweep (revision/a6-parameter-sweeps/rob/) ---
# sweep_rob.py pins the same detected events and SST1 midpoints as A2 Step 3.
a6_rob:
  samples_from: a2_step3
# --- A7 Job 3 (revision/a7-review-checks/job3/): reverse-complement symmetry ---
# The fusion scaffold annotated in both orientations, as a contig of the
# original (unscaffolded) assembly.
a7_job3:
  sample: GM03417
  haplotype: haplotype1
  contig: <fusion contig name in the original haplotype 1 FASTA>
  stem: <file stem for the extracted contig>
  description: <one-line description written to the result tables>
